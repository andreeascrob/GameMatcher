<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Game Matcher | Find Your Perfect Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* TEMA GAMER DARK & ORANGE */
            --bg-color: #0b0f19; 
            --card-bg: #151c2c; 
            --primary-orange: #ff6b00; 
            --dark-orange: #cc5500;
            --light-orange: rgba(255, 107, 0, 0.15); 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-color: #2a3441; 
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            --neon-glow: 0 0 15px rgba(255, 107, 0, 0.4); 
        }

        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 1400px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.2rem;
            color: var(--text-main);
            margin: 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--primary-orange);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* --- LAYOUT A DUE COLONNE --- */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .left-panel {
            flex: 0 0 380px; 
            position: relative; 
            
        }

        .right-panel {
            flex: 1; 
            min-width: 0;
        }

        /* --- Award Easter Egg --- */
        @keyframes award-pop {
    0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .award-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .award-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 3px solid var(--primary-orange);
            text-align: center;
            box-shadow: 0 0 50px var(--primary-orange);
            animation: award-pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }

        .award-card h2 {
            color: var(--primary-orange);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .award-card .game-title {
            font-size: 1.5rem;
            color: white;
            margin: 20px 0;
        }
        .award-card .match-btn {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: white;
            background: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .award-card .match-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 77, 0, 0.6);
            filter: brightness(1.1);
        }

        .award-card .match-btn:active {
            transform: translateY(1px);
        }

        /* --- Suggested Section --- */

        .mini-results-list {
        max-height: 400px;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Smaller, simpler cards for the sidebar */
    .mini-game-card {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.05);
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: 0.2s;
    }

    .mini-game-card:hover {
        border-color: var(--primary-orange);
        background: rgba(255, 255, 255, 0.1);
    }

    .mini-game-card img {
        width: 50px;
        height: 50px;
        border-radius: 4px;
        object-fit: cover;
    }

    .mini-game-info h4 {
        font-size: 0.85rem;
        margin: 0;
        color: white;
    }

    .mini-game-info p {
        font-size: 0.75rem;
        color: var(--primary-orange);
        margin: 0;
    }

        /* --- Form Sections --- */
        .section-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .section-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-orange);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 15px;
        }

        .field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        input:focus, select:focus {
            border-color: var(--primary-orange);
            outline: none;
            box-shadow: var(--neon-glow);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* --- AUTOCOMPLETE STYLES --- */
        .autocomplete-container {
            position: relative;
        }

        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--primary-orange);
            border-radius: 8px;
            margin-top: 4px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            display: none; 
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
            color: var(--text-main);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

        

        /* --- Results Area --- */
/* --- Results Area --- */
#results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

/* Base height shared by both - NO EXCEPTIONS */
.card-skeleton, .game-card {
    width: 100%;
    height: 180px; /* Your desired smaller height */
    border-radius: 12px;
    border: 1px solid var(--border-color); /* Same border for both */
    margin: 0;
    padding: 0;
    box-sizing: border-box; /* Includes border in the 180px */
    overflow: hidden;
    position: relative;
}

.card-skeleton {
    background: #151c2c;
    animation: pulse 1.5s infinite ease-in-out;
}

.game-card {
    background: var(--card-bg);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

/* Ensure the hover effect doesn't add extra width/height */
.game-card:hover {
    border-color: var(--primary-orange);
    transform: translateY(-4px);
    z-index: 10;
}

.card-content {
    padding: 15px;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 20%, rgba(11, 15, 25, 0.2) 100%);
}


        .match-badge {
            color: var(--primary-orange);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        @keyframes pulse {
            0% { background-color: #151c2c; }
            50% { background-color: #1e293b; }
            100% { background-color: #151c2c; }
        }

        .card-skeleton {
            height: 187.38888px;
            border-radius: 16px;
            background: #151c2c;
            border: 1px solid var(--border-color);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .price-tag {
            display: inline-block;
            background: var(--light-orange);
            color: var(--primary-orange);
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            align-self: flex-start;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1px;
            margin-top: auto;
        }

        /* --- MULTI-SELECT DROPDOWN STYLES --- */
        .custom-multiselect {
            position: relative;
            width: 100%;
            user-select: none;
        }

        .custom-multiselect summary {
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0b0f19; /* Matches your input bg */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        /* Removes default arrow in Safari */
        .custom-multiselect summary::-webkit-details-marker {
            display: none;
        }

        /* Custom arrow using your orange theme */
        .custom-multiselect summary::after {
            content: '▼';
            font-size: 0.7rem;
            color: var(--primary-orange);
            transition: transform 0.3s ease;
        }

        /* Rotate arrow when open */
        .custom-multiselect[open] summary::after {
            transform: rotate(180deg);
        }

        /* Focus glow when open */
        .custom-multiselect[open] summary {
            border-color: var(--primary-orange);
            box-shadow: var(--neon-glow);
        }

        /* Floating Options List */
        .options-list {
            position: absolute;
            top: calc(100%);
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .options-list label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 0.5px 8px;
            color: var(--text-main);
            font-size: 0.8rem;
            transition: background 0.2s;
            
            text-transform: none; /* Keep text readable */
            letter-spacing: normal;
        }

        .options-list label:last-child {
            border-bottom: none;
        }

        .options-list label:hover {
            background: var(--border-color);
        }

        /* Customizing the Checkbox color */
        .options-list input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-orange); /* Modern browsers support this */
        }

        /* --- MODAL (POP-UP) STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            display: none; 
            align-items: center; justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--primary-orange);
            border-radius: 16px;
            width: 90%; max-width: 650px;
            padding: 30px;
            position: relative;
            box-shadow: var(--neon-glow), var(--shadow);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 2rem;
            cursor: pointer; transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover { color: var(--primary-orange); }

        .modal-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin-top: 0; margin-bottom: 20px;
            padding-right: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .modal-detail {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .modal-detail.full-width {
            grid-column: 1 / -1;
        }

        .modal-label {
            font-size: 0.75rem;
            color: var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .modal-value {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .left-panel { flex: auto; width: 100%; position: static; }
            .modal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<script>

        return str
            .replace(/â„¢/g, '™')

    // --- LOGICA MODAL (POP-UP) ---
    function openGameModal(gameName, sparqlPrice) {
        const modal = document.getElementById('game-modal');
        const titleElement = document.getElementById('modal-title');
        const bodyElement = document.getElementById('modal-body');

        // Pulisce la stringa dagli spazi extra
        const cleanGameName = gameName.trim();
        titleElement.textContent = cleanGameName;

        const gameInfo = localGameData.find(g => 
            g.NAME && g.NAME.toLowerCase().trim() === cleanGameName.toLowerCase()
        );

        if (gameInfo) {
            const cpus = [gameInfo.CPU_0, gameInfo.CPU_1, gameInfo.CPU_2, gameInfo.CPU_3];
            const cleanCPUs = cpus.filter(item => item !== null && item !== "null" && item !== "").join("<br>• ");

            const gpus = [gameInfo.GPU_0, gameInfo.GPU_1, gameInfo.GPU_2, gameInfo.GPU_3, gameInfo.GPU_4, gameInfo.GPU_5, gameInfo.GPU_6, gameInfo.GPU_7];
            const cleanGPUs = gpus.filter(item => item !== null && item !== "null" && item !== "").join("<br>• ");

            bodyElement.innerHTML = `
                <div class="modal-detail">
                    <div class="modal-label">Price</div>
                    <div class="modal-value">${gameInfo.PRICE && gameInfo.PRICE !== "null" ? gameInfo.PRICE : '€' + sparqlPrice}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">PEGI Rating</div>
                    <div class="modal-value">${gameInfo.PEGI && gameInfo.PEGI !== "null" ? gameInfo.PEGI : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Genre</div>
                    <div class="modal-value">${gameInfo.GENRE && gameInfo.GENRE !== "null" ? gameInfo.GENRE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Player Mode</div>
                    <div class="modal-value">${gameInfo.MODE && gameInfo.MODE !== "null" ? gameInfo.MODE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Operating System</div>
                    <div class="modal-value">${gameInfo.OS && gameInfo.OS !== "null" ? gameInfo.OS : 'N/A'}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">Memory (RAM)</div>
                    <div class="modal-value">${gameInfo.RAM && gameInfo.RAM !== "null" ? gameInfo.RAM : 'N/A'}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">Storage Required</div>
                    <div class="modal-value">${gameInfo.STORAGE && gameInfo.STORAGE !== "null" ? gameInfo.STORAGE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Supported CPUs</div>
                    <div class="modal-value">${cleanCPUs ? '• ' + cleanCPUs : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Supported GPUs</div>
                    <div class="modal-value">${cleanGPUs ? '• ' + cleanGPUs : 'N/A'}</div>

    async function fetchSuggestions(hardwareClass, searchTerm, boxId, inputId) {

        if (searchTerm.length < 2) {

            return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
            const query = `
                PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
                PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                
                SELECT DISTINCT ?itemName WHERE {
                    ?item rdf:type :${hardwareClass} .
                    OPTIONAL { ?item rdfs:label ?lbl }
                    BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?item), "^.*#(CPU_|GPU_)?", ""), "_", " ")) AS ?itemName)
                    FILTER(CONTAINS(LCASE(?itemName), LCASE("${searchTerm}")))
                }
                ORDER BY ?itemName
                LIMIT 5
            `;

            try {
                const response = await fetch(endpointUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/sparql-query",
                        "Accept": "application/sparql-results+json"
                    },
                    body: query
                });

                if (!response.ok) throw new Error("Network error");

                const data = await response.json();
                const bindings = data.results.bindings;

                suggestionBox.innerHTML = ''; 

                if (bindings.length > 0) {
                    bindings.forEach(res => {
                        // APPLICA LA FUNZIONE QUI
                        const name = fixText(res.itemName.value);
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = name;
                        
                        div.onclick = () => {

                }

    // --- MAIN LOGIC (SEARCH GAMES) ---
    let matchDebounceTimer;

    function startMatching() {
        clearTimeout(matchDebounceTimer);
        matchDebounceTimer = setTimeout(runMatchQuery, 500);
       
    }

    async function runMatchQuery() {
        const resultsArea = document.getElementById('results');
        resultsArea.innerHTML = '<p style="text-align:center; width:100%; color: var(--primary-orange); font-weight: bold;">Scanning Knowledge Graph...</p>';


        const ram = document.getElementById('ram').value || 999; 
        const gpu = document.getElementById('gpu').value || 999; 
        const cpu = document.getElementById('cpu').value || 999; 
        const storage = document.getElementById('storage').value || 999; 
        const os = document.getElementById('os').value || 999; 
        const budget = document.getElementById('budget').value || 999; 
        const age = document.getElementById('age').value || 999; 

        // 1. Get the values from the checkboxes

        const selectedGenres = getSelectedChoices('genre-options');
        const selectedModes = getSelectedChoices('mode-options');

        

        fetchUpgradeSuggestions();

       // 2. Prepare the Genre Filter and Count
        let genreFilter = "";
        let genreCountRequirement = "";

        // Build the Genre block (OR logic)
        let genreLogic = "";
        if (selectedGenres.length > 0) {
            // Format: "Genre1" "Genre2" "Genre3"
            const genreValues = selectedGenres.map(g => `"${g}"`).join(" ");
            genreLogic = `
                ?game :hasGenre ?g .
                ?g rdfs:label ?gLabel .
                VALUES ?gLabel { ${genreValues} }
            `;
        }

        // Build the Mode block (OR logic)
        let modeLogic = "";
        if (selectedModes.length > 0) {
            // Format: "Mode1" "Mode2"
            const modeValues = selectedModes.map(m => `"${m}"`).join(" ");
            modeLogic = `
                ?game :hasPlayerMode ?m .
                ?m rdfs:label ?mLabel .
                VALUES ?mLabel { ${modeValues} }
            `;
        }
        const query = `
            PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
            PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            
            SELECT DISTINCT ?gameName ?price 
                (SAMPLE(?cpu_scoreU) AS ?userCPU) (SAMPLE(?cpu_scoreG) AS ?gameCPU)
                (SAMPLE(?gpu_scoreU) AS ?userGPU) (SAMPLE(?gpu_scoreG) AS ?gameGPU)
                (SAMPLE(?os_versionU) AS ?userOS) (SAMPLE(?os_versionG) AS ?gameOS)
                (SAMPLE(?ram_sizeU) AS ?userRAM) (SAMPLE(?ram_sizeG) AS ?gameRAM)
                (SAMPLE(?rom_sizeU) AS ?userROM) (SAMPLE(?rom_sizeG) AS ?gameROM)
                (GROUP_CONCAT(DISTINCT ?allGLabel; separator=", ") AS ?allGenres)
                (GROUP_CONCAT(DISTINCT ?allMLabel; separator=", ") AS ?allModes)
            WHERE {
                ?game rdf:type :VideoGame .
                
                # 1. MANDATORY "OR" FILTERS (One join per selection)
                ${genreLogic}
                ${modeLogic}

                # 2. DATA FOR DISPLAY (Fetch labels for the card)
                ?game :hasGenre ?allG . ?allG rdfs:label ?allGLabel .
                ?game :hasPlayerMode ?allM . ?allM rdfs:label ?allMLabel .

                # Basic Info
                OPTIONAL { ?game rdfs:label ?lbl }
                BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?game), "^.*#(Game_|VideoGame_)?", ""), "_", " ")) AS ?gameName)
                
                ?game :hasPrice ?price .
                FILTER(?price <= ${budget})

                # PEGI and Hardware (Keeping your existing logic)
                ?game :hasPEGI ?pegi .
                ?pegi :hasPEGIAgeThreshold ?pegi_value .
                FILTER(?pegi_value <= ${age})
                
                ?game :hasMinRequirement ?req .
                ?req :requiresCPUBenchmarkScore ?cpu_scoreG ;
                    :requiresGPUBenchmarkScore ?gpu_scoreG ;
                    :requiresMemoryGB ?ram_sizeG ;
                    :requiresStorageSpaceGB ?rom_sizeG ;
                    :requiresMinOSVersionValue ?os_versionG .

                # Hardware Optional Matching...
                # 2. OPTIONALLY MATCH THE USER'S CPU
                OPTIONAL {
                    ?cpuU rdfs:label ?cpuLabel .
                    FILTER(CONTAINS(LCASE(STR(?cpuLabel)), LCASE("${cpu}")))
                    ?cpuU :hasBenchmarkScore ?cpu_scoreU .
                }


                # 3. OPTIONALLY MATCH THE USER'S GPU
                OPTIONAL {
                    ?gpuU rdfs:label ?gpuLabel .
                    FILTER(CONTAINS(LCASE(STR(?gpuLabel)), LCASE("${gpu}")))
                    ?gpuU :hasBenchmarkScore ?gpu_scoreU .
                }


                # 4. OPTIONALLY MATCH THE USER'S OS
                OPTIONAL {
                    ?osU rdfs:label ?osLabel .
                    FILTER(CONTAINS(LCASE(STR(?osLabel)), LCASE("${os}")))
                    ?osU :hasOSVersionValue ?os_versionU .

                }

                BIND(${ram} AS ?ram_sizeU)

                BIND(${storage} AS ?rom_sizeU) 

                FILTER (!BOUND(?cpu_scoreU)  || ?cpu_scoreU  >= ?cpu_scoreG)
                FILTER (!BOUND(?gpu_scoreU)  || ?gpu_scoreU  >= ?gpu_scoreG)
                FILTER (!BOUND(?os_versionU) || ?os_versionU >= ?os_versionG)
                FILTER (!BOUND(?ram_sizeU) || ?ram_sizeU >= ?ram_sizeG)
                FILTER (!BOUND(?rom_sizeU) || ?rom_sizeU >= ?rom_sizeG)
            } 
            GROUP BY ?gameName ?price 
            ORDER BY ?price
            
        `;

        

        try {
            const response = await fetch(endpointUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/sparql-query",
                    "Accept": "application/sparql-results+json"
                },
                body: query
            });

            if (!response.ok) throw new Error("Network error");

            const data = await response.json();
            const bindings = data.results.bindings;

            displayResults(bindings);

        } catch (error) {
            resultsArea.innerHTML = `<p style="color:#ef4444; text-align:center;">Connection Error: ${error.message}</p>`;
            console.error("SPARQL Error:", error);
        }
        

    }


async function fetchUpgradeSuggestions() {
    const container = document.getElementById('upgrade-results');
    
    const selectedGenres = getSelectedChoices('genre-options');
    const selectedModes = getSelectedChoices('mode-options');

    // CHANGE: Check if BOTH are empty, or if EITHER is missing.
    // We want to require at least one Genre AND at least one Mode.
    if (selectedGenres.length === 0 || selectedModes.length === 0) {
        // Hide the section if requirements aren't met
        document.getElementById('upgrade-section').style.display = 'none';
        return;
    }

    let genreLogic = "";
    selectedGenres.forEach((g, i) => {
        genreLogic += `
            ?game :hasGenre ?g${i} .
            ?g${i} rdfs:label "${g}" .
        `;
    });
    
    let modeLogic = "";
    selectedModes.forEach((m, i) => {
        modeLogic += `
            ?game :hasPlayerMode ?m${i} .
            ?m${i} rdfs:label "${m}" .
        `;
    });

    const upgradeQuery = `
        PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        
        SELECT DISTINCT ?gameName WHERE {
            ?game rdf:type :VideoGame .
            ${genreLogic}
            ${modeLogic}
            
            OPTIONAL { ?game rdfs:label ?lbl }
            BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?game), "^.*#", ""), "_", " ")) AS ?gameName)
        } LIMIT 5`;

    try {
        const response = await fetch(endpointUrl, { 
            method: "POST",
            headers: { 
                "Content-Type": "application/sparql-query", 
                "Accept": "application/sparql-results+json" 
            },
            body: upgradeQuery
        });
        
        const data = await response.json();
        const bindings = data.results.bindings;
        const section = document.getElementById('upgrade-section');

        if (bindings.length > 0) {
            // Show the section and render cards
            section.style.display = 'block';
            renderMiniCards(bindings);
        } else {
            // Hide the entire section if no games match
            section.style.display = 'none';
        }
        
    } catch (e) {
        console.error("Upgrade logic error:", e);
        document.getElementById('upgrade-section').style.display = 'none';
    }
}

async function renderMiniCards(bindings) {
    const container = document.getElementById('upgrade-results');
    container.innerHTML = '';

    for (const res of bindings) {
        const name = fixText(res.gameName.value);
        const imgUrl = await getGameImage(name); // Reuse your RAWG function

        const miniCard = document.createElement('div');
        miniCard.className = 'mini-game-card';
        miniCard.onclick = () => openGameModal(name, "Check Full Specs");
        
        miniCard.innerHTML = `
            <img src="${imgUrl}" alt="${name}">
            <div class="mini-game-info">
                <h4>${name}</h4>
                
            </div>
        `;
        container.appendChild(miniCard);
    }
}

    async function displayResults(bindings) {
    const resultsArea = document.getElementById('results');
    resultsArea.innerHTML = '';

    if (bindings.length === 0) {
        resultsArea.innerHTML = '<p style="text-align:center; width:100%; color: var(--text-muted);">No games found.</p>';
        return;
    }

    let awardGameName = null;
    let awardTriggeredLocally = false;

    // 1. Create Skeletons
    const skeletons = bindings.map(() => {
        const div = document.createElement('div');
        div.className = 'card-skeleton';
        resultsArea.appendChild(div);
        return div;
    });

    // 2. Process games
    for (let i = 0; i < bindings.length; i++) {
        const res = bindings[i];
        
        // --- SAFETY CHECK BLOCK: This prevents the "Stuck" bug ---
        // Using ?. and ?? 0 ensures that if a value is missing, the code doesn't crash.
        const name = res.gameName ? fixText(res.gameName.value) : "Unknown Game";
        const price = res.price ? parseFloat(res.price.value).toFixed(2) : "0.00";

        const uCPU = res.userCPU ? parseInt(res.userCPU.value) : 0;
        const rCPU = res.gameCPU ? parseInt(res.gameCPU.value) : -1;

        const uGPU = res.userGPU ? parseInt(res.userGPU.value) : 0;
        const rGPU = res.gameGPU ? parseInt(res.gameGPU.value) : -1;

        const uRAM = res.userRAM ? parseInt(res.userRAM.value) : 0;
        const rRAM = res.gameRAM ? parseInt(res.gameRAM.value) : -1;

        const uROM = res.userROM ? parseInt(res.userROM.value) : 0;
        const rROM = res.gameROM ? parseInt(res.gameROM.value) : -1;

        const uOS = res.userOS ? parseInt(res.userOS.value) : 0;
        const rOS = res.gameOS ? parseInt(res.gameOS.value) : -1;

        // Check for award match (Only if we have valid data)
        if (!awardTriggeredLocally && uCPU === rCPU && uGPU === rGPU && uRAM === rRAM && uROM >= rROM && uOS === rOS) {
            awardGameName = name; 
            awardTriggeredLocally = true; 
        }
        // -------------------------------------------------------

        const imgUrl = await getGameImage(name);
        
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGameModal(name, price);
        
        card.style.backgroundImage = `linear-gradient(to bottom, rgba(11, 15, 25, 0.2), rgba(11, 15, 25, 0.9)), url('${imgUrl}')`;
        card.style.opacity = '0';
        card.style.transition = 'opacity 0.4s ease-in';

        card.innerHTML = `
            <div class="card-content" style="padding: 25px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;">
                <div><h3 style="margin: 0;">${name}</h3></div>
                <div class="price-tag" style="align-self: flex-start; margin: 0;">€${price}</div>
            </div>
        `;

        const img = new Image();
        img.src = imgUrl;
        
        img.onload = () => {
            if (skeletons[i]) {
                skeletons[i].replaceWith(card);
                setTimeout(() => { card.style.opacity = '1'; }, 10);
            }
        };

        img.onerror = () => {
            if (skeletons[i]) {
                skeletons[i].replaceWith(card);
                card.style.opacity = '1';
            }
        };
    }

    // 3. Launch Award AFTER the loop
    // This prevents the party logic from stopping the card rendering
    if (awardGameName) {
        console.log("Entrato")
        setTimeout(() => {
            triggerCompatibilityAward(awardGameName);
        }, 1200); // Delay slightly so user sees the cards first
    }
}
