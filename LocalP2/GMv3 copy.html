<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Matcher | Find Your Perfect Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* TEMA GAMER DARK & ORANGE */
            --bg-color: #0b0f19; 
            --card-bg: #151c2c; 
            --primary-orange: #ff6b00; 
            --dark-orange: #cc5500;
            --light-orange: rgba(255, 107, 0, 0.15); 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-color: #2a3441; 
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            --neon-glow: 0 0 15px rgba(255, 107, 0, 0.4); 
        }

        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 1400px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.2rem;
            color: var(--text-main);
            margin: 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--primary-orange);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* --- LAYOUT A DUE COLONNE --- */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .left-panel {
            flex: 0 0 380px; 
            position: sticky; 
            top: 20px;
        }

        .right-panel {
            flex: 1; 
            min-width: 0;
        }

        /* --- Form Sections --- */
        .section-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .section-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-orange);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 15px;
        }

        .field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        input:focus, select:focus {
            border-color: var(--primary-orange);
            outline: none;
            box-shadow: var(--neon-glow);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* --- AUTOCOMPLETE STYLES --- */
        .autocomplete-container {
            position: relative;
        }

        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--primary-orange);
            border-radius: 8px;
            margin-top: 4px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            display: none; 
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
            color: var(--text-main);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

        

        /* --- Results Area --- */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            cursor: pointer; 
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-orange);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .game-card:hover {
            border-color: var(--primary-orange);
            box-shadow: var(--neon-glow), var(--shadow);
            transform: translateY(-5px);
        }

        .game-card:hover::before {
            transform: scaleX(1);
        }

        .game-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 1.3rem;
            line-height: 1.3;
            font-family: 'Space Grotesk', sans-serif;
        }

        .price-tag {
            display: inline-block;
            background: var(--light-orange);
            color: var(--primary-orange);
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            align-self: flex-start;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1px;
            margin-top: auto;
        }

        /* --- MULTI-SELECT DROPDOWN STYLES --- */
        .custom-multiselect {
            position: relative;
            width: 100%;
            user-select: none;
        }

        .custom-multiselect summary {
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0b0f19; /* Matches your input bg */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        /* Removes default arrow in Safari */
        .custom-multiselect summary::-webkit-details-marker {
            display: none;
        }

        /* Custom arrow using your orange theme */
        .custom-multiselect summary::after {
            content: '▼';
            font-size: 0.7rem;
            color: var(--primary-orange);
            transition: transform 0.3s ease;
        }

        /* Rotate arrow when open */
        .custom-multiselect[open] summary::after {
            transform: rotate(180deg);
        }

        /* Focus glow when open */
        .custom-multiselect[open] summary {
            border-color: var(--primary-orange);
            box-shadow: var(--neon-glow);
        }

        /* Floating Options List */
        .options-list {
            position: absolute;
            top: calc(100%);
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .options-list label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 0.5px 8px;
            color: var(--text-main);
            font-size: 0.8rem;
            transition: background 0.2s;
            
            text-transform: none; /* Keep text readable */
            letter-spacing: normal;
        }

        .options-list label:last-child {
            border-bottom: none;
        }

        .options-list label:hover {
            background: var(--border-color);
        }

        /* Customizing the Checkbox color */
        .options-list input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-orange); /* Modern browsers support this */
        }

        /* --- MODAL (POP-UP) STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            display: none; 
            align-items: center; justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--primary-orange);
            border-radius: 16px;
            width: 90%; max-width: 650px;
            padding: 30px;
            position: relative;
            box-shadow: var(--neon-glow), var(--shadow);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 2rem;
            cursor: pointer; transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover { color: var(--primary-orange); }

        .modal-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin-top: 0; margin-bottom: 20px;
            padding-right: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .modal-detail {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .modal-detail.full-width {
            grid-column: 1 / -1;
        }

        .modal-label {
            font-size: 0.75rem;
            color: var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .modal-value {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .left-panel { flex: auto; width: 100%; position: static; }
            .modal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="game-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal(event)">×</button>
        <h2 class="modal-header" id="modal-title">Game Title</h2>
        <div class="modal-grid" id="modal-body"></div>
    </div>
</div>

<div class="wrapper">
    <header>
        <h1>Game<span>Matcher</span></h1>
        <p>Enter your specs to find games that run smoothly on your rig.</p>
    </header>

    <div class="main-layout">
        
        <div class="left-panel">
            <div class="section-box">

                    <div class="field autocomplete-container">

                        <div id="gpu-suggestions" class="suggestions-box"></div>
                    </div>

                        <select id="ram" onchange="startMatching()">
                            <option value="4">4 GB</option>

            </div>

            

           <div class="section-box">
    <div class="section-header">Game Preferences</div>
    <div class="input-grid">
        
        <div class="field">
            <label>Genre</label>
            <details class="custom-multiselect">
                <summary>Select Genres...</summary>
                <div class="options-list" id="genre-options">

        <div class="field">
            <label>Player Mode</label>
            <details class="custom-multiselect">
                <summary>Select Modes...</summary>
                <div class="options-list" id="mode-options">
                    <div class="loading-text">Loading modes...</div>
                </div>
            </details>
        </div>

    </div>
</div>

            <div class="section-box">
                <div class="section-header">Personal & Budget</div>
                <div class="input-grid">
                    <div class="field">
                        <label>Age</label>
                        <input type="number" id="age" placeholder="Enter your age" oninput="startMatching()">
                    </div>
                    <div class="field">
                        <label>Max Budget (€)</label>
                        <input type="number" id="budget" placeholder="e.g. 50" oninput="startMatching()">
                    </div>
                </div>
            </div>

        <div class="right-panel">
            <div id="results"></div>

    </div>
</div>

<script src="steam_parsed_CLEAN.js"></script>

<script>
    const endpointUrl = "https://api.triplydb.com/datasets/EdoardoTommasi/GameMatcher-1/sparql";

    // --- FUNZIONE PER RIPARARE I CARATTERI ROTTI (MOJIBAKE) ---
    function fixText(str) {
        if (!str) return str;
        return str
            .replace(/â„¢/g, '™')
            .replace(/Â®/g, '®')
            .replace(/Ã©/g, 'é')
            .replace(/Ã³/g, 'ó')
            .replace(/Ã /g, 'à')
            .replace(/Ã¨/g, 'è')
            .replace(/Ã¬/g, 'ì')
            .replace(/Ã¹/g, 'ù')
            .replace(/â€“/g, '–')
            .replace(/â€”/g, '—')
            .replace(/â€™/g, "'");
    }

    // --- LOGICA MODAL (POP-UP) ---
    function openGameModal(gameName, sparqlPrice) {
        const modal = document.getElementById('game-modal');
        const titleElement = document.getElementById('modal-title');
        const bodyElement = document.getElementById('modal-body');

        // Pulisce la stringa dagli spazi extra
        const cleanGameName = gameName.trim();
        titleElement.textContent = cleanGameName;

        const gameInfo = localGameData.find(g => 
            g.NAME && g.NAME.toLowerCase().trim() === cleanGameName.toLowerCase()
        );

        if (gameInfo) {
            const cpus = [gameInfo.CPU_0, gameInfo.CPU_1, gameInfo.CPU_2, gameInfo.CPU_3];
            const cleanCPUs = cpus.filter(item => item !== null && item !== "null" && item !== "").join("<br>• ");

            const gpus = [gameInfo.GPU_0, gameInfo.GPU_1, gameInfo.GPU_2, gameInfo.GPU_3, gameInfo.GPU_4, gameInfo.GPU_5, gameInfo.GPU_6, gameInfo.GPU_7];
            const cleanGPUs = gpus.filter(item => item !== null && item !== "null" && item !== "").join("<br>• ");

            bodyElement.innerHTML = `
                <div class="modal-detail">
                    <div class="modal-label">Price</div>
                    <div class="modal-value">${gameInfo.PRICE && gameInfo.PRICE !== "null" ? gameInfo.PRICE : '€' + sparqlPrice}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">PEGI Rating</div>
                    <div class="modal-value">${gameInfo.PEGI && gameInfo.PEGI !== "null" ? gameInfo.PEGI : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Genre</div>
                    <div class="modal-value">${gameInfo.GENRE && gameInfo.GENRE !== "null" ? gameInfo.GENRE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Player Mode</div>
                    <div class="modal-value">${gameInfo.MODE && gameInfo.MODE !== "null" ? gameInfo.MODE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Operating System</div>
                    <div class="modal-value">${gameInfo.OS && gameInfo.OS !== "null" ? gameInfo.OS : 'N/A'}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">Memory (RAM)</div>
                    <div class="modal-value">${gameInfo.RAM && gameInfo.RAM !== "null" ? gameInfo.RAM : 'N/A'}</div>
                </div>
                <div class="modal-detail">
                    <div class="modal-label">Storage Required</div>
                    <div class="modal-value">${gameInfo.STORAGE && gameInfo.STORAGE !== "null" ? gameInfo.STORAGE : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Supported CPUs</div>
                    <div class="modal-value">${cleanCPUs ? '• ' + cleanCPUs : 'N/A'}</div>
                </div>
                <div class="modal-detail full-width">
                    <div class="modal-label">Supported GPUs</div>
                    <div class="modal-value">${cleanGPUs ? '• ' + cleanGPUs : 'N/A'}</div>
                </div>
            `;
        } else {
            bodyElement.innerHTML = `
                <div class="modal-detail full-width">
                    <div class="modal-value" style="color: var(--text-muted); text-align: center;">
                        Additional details not found in the local database file.<br><br>
                        <strong>Price found in Knowledge Graph:</strong> €${sparqlPrice}
                    </div>
                </div>
            `;
        }

        modal.classList.add('show');
    }

    function closeModal(event) {
        if (!event || event.target.id === 'game-modal' || event.target.classList.contains('close-btn')) {
            document.getElementById('game-modal').classList.remove('show');
        }
    }

    // --- DYNAMIC DROPDOWN LOADING ---
    async function populateDropdown(className, selectId) {
        const query = `
            PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
            PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            
            SELECT DISTINCT ?itemName WHERE {
                ?item rdf:type :${className} .
                OPTIONAL { ?item rdfs:label ?lbl }
                BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?item), "^.*#(GameGenre_|PlayerMode_|OperatingSystem_|Genre_|Mode_|OS_)?", ""), "_", " ")) AS ?itemName)
            }
            ORDER BY ?itemName
        `;

        try {
            const response = await fetch(endpointUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/sparql-query",
                    "Accept": "application/sparql-results+json"
                },
                body: query
            });

            const data = await response.json();
            const selectElement = document.getElementById(selectId);
            
            selectElement.innerHTML = '<option value="">Any</option>';
            
            data.results.bindings.forEach(res => {
                // APPLICA LA FUNZIONE QUI
                const name = fixText(res.itemName.value);
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                selectElement.appendChild(option);
            });
        } catch (error) {
            console.error(`Error loading ${className}:`, error);
            document.getElementById(selectId).innerHTML = '<option value="">Error loading</option>';
        }
    }

    async function populateDropdownMulti(className, selectId) {
    const query = `
        PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        
        SELECT DISTINCT ?itemName WHERE {
            ?item rdf:type :${className} .
            OPTIONAL { ?item rdfs:label ?lbl }
            BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?item), "^.*#(GameGenre_|PlayerMode_|OperatingSystem_|Genre_|Mode_|OS_)?", ""), "_", " ")) AS ?itemName)
        }
        ORDER BY ?itemName
    `;

    try {
        const response = await fetch(endpointUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/sparql-query",
                "Accept": "application/sparql-results+json"
            },
            body: query
        });

        const data = await response.json();
        const container = document.getElementById(selectId);
        
        // Clear the "Loading..." text
        container.innerHTML = '';

        data.results.bindings.forEach(res => {
            const name = fixText(res.itemName.value);
            
            // 1. Create the label wrapper
            const label = document.createElement('label');
            
            // 2. Create the checkbox input
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = name;
            // This ensures your results update every time you click a checkbox
            checkbox.onchange = () => startMatching(); 

            // 3. Assemble: [Checkbox] Text
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(" " + name));
            
            // 4. Add to the options-list div
            container.appendChild(label);
        });
    } catch (error) {
        console.error(`Error loading ${className}:`, error);
        document.getElementById(selectId).innerHTML = '<div style="padding:10px; color:red;">Error loading</div>';
    }
}

    document.addEventListener("DOMContentLoaded", () => {
        populateDropdown('OperatingSystem', 'os');
        populateDropdownMulti('GameGenre', 'genre-options');
        populateDropdownMulti('PlayerMode', 'mode-options');
        startMatching(); 
    });

    // --- GET MULTICHOICES ---
    function getSelectedChoices(containerId) {
    // 1. Find the container (e.g., 'genre-options')
    const container = document.getElementById(containerId);
    
    // 2. Find all checkboxes inside that are currently 'checked'
    const checkedCheckboxes = container.querySelectorAll('input[type="checkbox"]:checked');
    
    // 3. Extract the 'value' from those checkboxes and put them in an array
    const selectedValues = Array.from(checkedCheckboxes).map(cb => cb.value);
    
    return selectedValues; // This returns an array like ["Action", "RPG"]
}

    // --- AUTOCOMPLETE LOGIC ---
    let debounceTimer;

    async function fetchSuggestions(hardwareClass, searchTerm, boxId, inputId) {
        const suggestionBox = document.getElementById(boxId);
        
        if (searchTerm.length < 2) {
            suggestionBox.style.display = 'none';
            return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
            const query = `
                PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
                PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                
                SELECT DISTINCT ?itemName WHERE {
                    ?item rdf:type :${hardwareClass} .
                    OPTIONAL { ?item rdfs:label ?lbl }
                    BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?item), "^.*#(CPU_|GPU_)?", ""), "_", " ")) AS ?itemName)
                    FILTER(CONTAINS(LCASE(?itemName), LCASE("${searchTerm}")))
                }
                ORDER BY ?itemName
                LIMIT 5
            `;

            try {
                const response = await fetch(endpointUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/sparql-query",
                        "Accept": "application/sparql-results+json"
                    },
                    body: query
                });

                if (!response.ok) throw new Error("Network error");

                const data = await response.json();
                const bindings = data.results.bindings;

                suggestionBox.innerHTML = ''; 

                if (bindings.length > 0) {
                    bindings.forEach(res => {
                        // APPLICA LA FUNZIONE QUI
                        const name = fixText(res.itemName.value);
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = name;
                        
                        div.onclick = () => {
                            document.getElementById(inputId).value = name; 
                            suggestionBox.style.display = 'none'; 
                            startMatching();
                        };
                        suggestionBox.appendChild(div);
                    });
                    suggestionBox.style.display = 'block'; 
                } else {
                    suggestionBox.style.display = 'none';
                }
            } catch (error) {
                console.error("Autocomplete Error:", error);
            }
        }, 300); 
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.autocomplete-container')) {
            document.getElementById('cpu-suggestions').style.display = 'none';
            document.getElementById('gpu-suggestions').style.display = 'none';
        }
    });

    // --- MAIN LOGIC (SEARCH GAMES) ---
    let matchDebounceTimer;

    function startMatching() {
        clearTimeout(matchDebounceTimer);
        matchDebounceTimer = setTimeout(runMatchQuery, 500); 
    }

    async function runMatchQuery() {
        const resultsArea = document.getElementById('results');
        resultsArea.innerHTML = '<p style="text-align:center; width:100%; color: var(--primary-orange); font-weight: bold;">Scanning Knowledge Graph...</p>';


        const ram = document.getElementById('ram').value || 999; 
        const gpu = document.getElementById('gpu').value || 999; 
        const cpu = document.getElementById('cpu').value || 999; 
        const storage = document.getElementById('storage').value || 999; 
        const os = document.getElementById('os').value || 999; 
        const budget = document.getElementById('budget').value || 999; 
        const age = document.getElementById('age').value || 999; 

        // 1. Get the values from the checkboxes

        const selectedGenres = getSelectedChoices('genre-options');
        const selectedModes = getSelectedChoices('mode-options');

       // 2. Prepare the Genre Filter and Count
        let genreFilter = "";
        let genreCountRequirement = "";

        // Build the Genre block
        let genreLogic = "";
        if (selectedGenres.length > 0) {
            selectedGenres.forEach((genre, index) => {
                genreLogic += `
                    ?game :hasGenre ?g${index} .
                    ?g${index} rdfs:label "${genre}" .
                `;
            });
        }

        // Build the Mode block
        let modeLogic = "";
        if (selectedModes.length > 0) {
            selectedModes.forEach((mode, index) => {
                modeLogic += `
                    ?game :hasPlayerMode ?m${index} .
                    ?m${index} rdfs:label "${mode}" .
                `;
            });
        }
        const query = `
            PREFIX : <http://www.semanticweb.org/gamematcher.owl#>
            PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            
            SELECT DISTINCT ?gameName ?price 
                (GROUP_CONCAT(DISTINCT ?allGLabel; separator=", ") AS ?allGenres)
                (GROUP_CONCAT(DISTINCT ?allMLabel; separator=", ") AS ?allModes)
            WHERE {
                ?game rdf:type :VideoGame .
                
                # 1. MANDATORY "AND" FILTERS (One join per selection)
                ${genreLogic}
                ${modeLogic}

                # 2. DATA FOR DISPLAY (Fetch labels for the card)
                ?game :hasGenre ?allG . ?allG rdfs:label ?allGLabel .
                ?game :hasPlayerMode ?allM . ?allM rdfs:label ?allMLabel .

                # Basic Info
                OPTIONAL { ?game rdfs:label ?lbl }
                BIND(COALESCE(STR(?lbl), REPLACE(REPLACE(STR(?game), "^.*#(Game_|VideoGame_)?", ""), "_", " ")) AS ?gameName)
                
                ?game :hasPrice ?price .
                FILTER(?price <= ${budget})

                # PEGI and Hardware (Keeping your existing logic)
                ?game :hasPEGI ?pegi .
                ?pegi :hasPEGIAgeThreshold ?pegi_value .
                FILTER(?pegi_value <= ${age})
                
                ?game :hasMinRequirement ?req .
                ?req :requiresCPUBenchmarkScore ?cpu_scoreG ;
                    :requiresGPUBenchmarkScore ?gpu_scoreG ;
                    :requiresMemoryGB ?ram_sizeG ;
                    :requiresStorageSpaceGB ?rom_sizeG ;
                    :requiresMinOSVersionValue ?os_versionG .

                # Hardware Optional Matching...
                # 2. OPTIONALLY MATCH THE USER'S CPU
                OPTIONAL {
                    ?cpuU rdfs:label ?cpuLabel .
                    FILTER(CONTAINS(LCASE(STR(?cpuLabel)), LCASE("${cpu}")))
                    ?cpuU :hasBenchmarkScore ?cpu_scoreU .
                }


                # 3. OPTIONALLY MATCH THE USER'S GPU
                OPTIONAL {
                    ?gpuU rdfs:label ?gpuLabel .
                    FILTER(CONTAINS(LCASE(STR(?gpuLabel)), LCASE("${gpu}")))
                    ?gpuU :hasBenchmarkScore ?gpu_scoreU .
                }


                # 4. OPTIONALLY MATCH THE USER'S OS
                OPTIONAL {
                    ?osU rdfs:label ?osLabel .
                    FILTER(CONTAINS(LCASE(STR(?osLabel)), LCASE("${os}")))
                    ?osU :hasOSVersionValue ?os_versionU .

                }

                BIND(${ram} AS ?ram_sizeU)

                BIND(${storage} AS ?rom_sizeU) 

                FILTER (!BOUND(?cpu_scoreU)  || ?cpu_scoreU  >= ?cpu_scoreG)
                FILTER (!BOUND(?gpu_scoreU)  || ?gpu_scoreU  >= ?gpu_scoreG)
                FILTER (!BOUND(?os_versionU) || ?os_versionU >= ?os_versionG)
                FILTER (!BOUND(?ram_sizeU) || ?ram_sizeU >= ?ram_sizeG)
                FILTER (!BOUND(?rom_sizeU) || ?rom_sizeU >= ?rom_sizeG)
            } 
            GROUP BY ?gameName ?price
            ORDER BY ?price
            LIMIT 21
        `;

        try {
            const response = await fetch(endpointUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/sparql-query",
                    "Accept": "application/sparql-results+json"
                },
                body: query
            });

            if (!response.ok) throw new Error("Network error");

            const data = await response.json();
            const bindings = data.results.bindings;

            displayResults(bindings);

        } catch (error) {
            resultsArea.innerHTML = `<p style="color:#ef4444; text-align:center;">Connection Error: ${error.message}</p>`;
            console.error("SPARQL Error:", error);
        }
    }

    function displayResults(bindings) {
        const resultsArea = document.getElementById('results');
        resultsArea.innerHTML = '';

        if (bindings.length === 0) {
            resultsArea.innerHTML = '<p style="text-align:center; width:100%; color: var(--text-muted);">No games found with these specs. Try upgrading your budget or lowering your requirements.</p>';
            return;
        }

        bindings.forEach(res => {
            // APPLICA LA FUNZIONE QUI! Ripara il nome del gioco!
            const name = fixText(res.gameName.value);
            const price = parseFloat(res.price.value).toFixed(2);
            
            const card = document.createElement('div');
            card.className = 'game-card';
            
            card.onclick = () => openGameModal(name, price);
            
            card.innerHTML = `
                <div>
                    <h3>${name}</h3>
                    <div>
                        <p style="color:var(--primary-orange); font-size:0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">Perfect Match ✨</p>
                    </div>
                </div>
                <div class="price-tag">€${price}</div>
            `;
            resultsArea.appendChild(card);
        });
    }
</script>
